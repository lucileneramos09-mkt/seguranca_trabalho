<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Segurança do Trabalho | Aula interativa</title><style>
:root{--navy:#17324a;--blue:#226a85;--teal:#087e83;--bg:#f3f8fa;--ink:#173047;--muted:#53697a}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}.top{height:9px;background:linear-gradient(90deg,#1b6587,#16a2a1,#e3a04c)}.app{max-width:1320px;margin:auto;min-height:calc(100vh - 9px);display:flex;flex-direction:column;padding:18px 34px}.nav{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;color:var(--navy)}.actions{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;cursor:pointer}.btn{border:1px solid #c5d9e0;border-radius:30px;background:white;color:var(--navy);font-weight:700;padding:10px 17px}.btn:hover,.btn:focus-visible{background:#d9f1ef}.primary{background:var(--teal);color:white;border-color:var(--teal)}.primary:hover{background:#06666a;color:white}.slide{display:none;flex:1;align-content:center;animation:fade .25s ease}.slide.active{display:grid;grid-template-columns:1fr;gap:18px}.eyebrow{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--teal);font-weight:800}.heading h1{font-size:clamp(34px,4.7vw,64px);line-height:1.08;margin:10px 0}.heading p{font-size:clamp(17px,1.6vw,23px);color:var(--muted);margin:0;line-height:1.45}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:center}.photo{width:100%;height:clamp(210px,35vh,380px);object-fit:cover;border-radius:22px;box-shadow:0 14px 40px #1d536a22}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{border:1px solid #c9dce2;border-radius:17px;background:white;padding:22px;text-align:left;min-height:132px;box-shadow:0 4px 15px #12354b09}.card strong{display:block;font-size:19px;margin-bottom:8px}.card small{display:block;color:var(--muted);font-size:15px;line-height:1.5}.card:hover,.card:focus-visible{border-color:#1d9297;box-shadow:0 8px 24px #157f8830;transform:translateY(-2px)}.reveal{background:#e5f5f2;border-left:5px solid var(--teal);border-radius:10px;padding:16px 20px;min-height:66px;line-height:1.5}.question{padding:20px;border:1px solid #c8dfe5;background:white;border-radius:16px}.options{display:grid;gap:10px;margin-top:15px}.option{background:#f5fafb;border:1px solid #c7dce2;border-radius:11px;padding:14px;text-align:left;color:var(--ink)}.option:hover{border-color:var(--teal);background:#e5f6f3}.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:16px;border-top:1px solid #d5e4e8}.progress{height:5px;background:#d7e7e9;border-radius:10px;overflow:hidden;margin-top:12px}.bar{height:100%;width:11.11%;background:var(--teal);transition:width .25s}.metadata{display:grid;gap:12px;margin-top:22px}.metadata div{padding:13px 18px;border-radius:12px;background:#e5eff4}.metadata b{color:var(--navy)}.big{font-size:clamp(22px,2.5vw,34px);font-weight:800;color:var(--navy)}.pill{display:inline-block;background:#e2f3ef;padding:7px 13px;border-radius:20px;color:#075d60;font-weight:700}.fine{font-size:12px;color:#637887}.hidden{display:none}@keyframes fade{from{opacity:.2;transform:translateY(7px)}to{opacity:1;transform:none}}@media(max-width:720px){.app{padding:15px}.hero{grid-template-columns:1fr}.photo{height:220px}.heading h1{font-size:34px}.nav{align-items:flex-start}.brand{font-size:13px}.btn{padding:9px 11px}.slide.active{align-content:start;padding-top:24px}}
</style></head><body><div class="top"></div><div class="app"><div class="nav"><div class="brand">TÉCNICO EM ADMINISTRAÇÃO <span style="color:#6a8291">• RH</span></div><div class="actions"><button class="btn" onclick="toggleFull()">⛶ Tela cheia</button><button class="btn" onclick="go(0)">⌂ Capa</button></div></div><main id="slides"></main><div class="foot"><span id="counter" class="fine">01 / 09</span><div class="actions"><button class="btn" id="prev" onclick="go(current-1)">← Anterior</button><button class="btn primary" id="next" onclick="go(current+1)">Próxima →</button></div></div><div class="progress"><div class="bar" id="bar"></div></div></div><script>
const slidesData=[["Capa institucional", "Segurança do Trabalho", "Legislação, CAT, NR-1 e NR-5"], ["Pergunta disparadora", "Um acidente aconteceu. E agora?", "Aja como profissional de Administração: qual deve ser a prioridade?"], ["Objetivos", "Três ações diferentes", "Prevenir riscos, comunicar acidentes e participar da prevenção por meio da CIPA."], ["Legislação", "Quem faz o quê?", "Explore as responsabilidades legais e organizacionais."], ["NR-1", "Gerenciar riscos antes do acidente", "Identificar perigos, avaliar riscos e adotar medidas de prevenção."], ["CAT", "Comunicar não é prevenir", "Conheça o procedimento de comunicação do acidente de trabalho."], ["NR-5", "CIPA em ação", "A comissão contribui para a prevenção de acidentes e doenças relacionadas ao trabalho."], ["Estudo de caso", "Decisão gerencial", "Aplique os conceitos em uma situação empresarial."], ["Encerramento", "O que aprendemos?", "Prevenir, comunicar e participar: responsabilidades complementares."]];const content=[[], [["1 · Atender", "Garantir socorro imediato e segurança da área, sem expor outras pessoas a riscos."], ["2 · Registrar", "Informar os responsáveis e reunir dados do ocorrido."], ["3 · Prevenir", "Investigar causas e revisar medidas preventivas; a CAT não substitui essas ações."]], [["Prevenção", "Reconhecer perigos e reduzir riscos antes que causem danos."], ["Comunicação", "Formalizar acidente de trabalho por meio da CAT, conforme a legislação."], ["Participação", "A CIPA acompanha e propõe melhorias preventivas, sem substituir as responsabilidades do empregador."]], [["Lei nº 8.213/1991, art. 22", "Estabelece a comunicação de acidente de trabalho à Previdência Social e os prazos legais."], ["NR-1", "Dispõe sobre disposições gerais e gerenciamento de riscos ocupacionais, entre outros temas."], ["NR-5", "Dispõe sobre a Comissão Interna de Prevenção de Acidentes e de Assédio (CIPA)."]], [["Identificar perigos", "Observe situações e fontes capazes de causar lesões ou agravos à saúde."], ["Avaliar riscos", "Considere a probabilidade e a gravidade dos possíveis danos."], ["Controlar e acompanhar", "Adote medidas de prevenção e verifique sua eficácia. Priorize medidas coletivas quando aplicável."]], [["O que é?", "A CAT é a Comunicação de Acidente de Trabalho: documento de comunicação previdenciária."], ["Quando?", "Regra geral: até o primeiro dia útil seguinte ao da ocorrência; em caso de morte, comunicação imediata à autoridade competente."], ["Quem comunica?", "Cabe à empresa; na sua falta, outros legitimados previstos na legislação podem formalizar a comunicação."], ["Atenção", "Emitir a CAT não substitui o atendimento, a apuração das causas nem a prevenção."]], [["Escuta e inspeção", "A CIPA pode acompanhar a identificação de perigos e a avaliação de riscos nos ambientes de trabalho."], ["Plano preventivo", "Propõe e acompanha ações para melhorar as condições de saúde e segurança."], ["Diálogo", "Promove participação dos trabalhadores e encaminha situações de risco."], ["Limites", "A CIPA não substitui a obrigação legal da empresa de gerenciar riscos ou emitir CAT."]], [["Cenário", "Uma funcionária escorrega em piso molhado, recebe atendimento e relata que não havia sinalização. A empresa afirma que basta emitir a CAT."], ["Sua missão", "Escolha a conduta mais completa e justifique: quais ações são imediatas, documentais e preventivas?"]], [["Síntese", "NR-1: prevenção e gerenciamento de riscos · CAT: comunicação do acidente · NR-5: participação da CIPA."], ["Pergunta final", "Se a CAT foi emitida, o problema de segurança está resolvido? Explique por quê."], ["Avaliação formativa", "Observe se a resposta diferencia atribuições, identifica o risco e propõe uma ação coerente."]]];const photos=["photo-1504307651254-35680f356dfd", "photo-1581091226825-a6a2a5aee158", "photo-1497366754035-f200968a6e72", "photo-1581092160607-ee22621dd758", "photo-1487958449943-2429e8be8625", "photo-1503387762-592deb58ef4e", "photo-1556761175-b413da4baf72", "photo-1581092918056-0c4c3acd3789", "photo-1521737711867-e3b97375f902"];const quiz=[{"q": "Qual é a melhor primeira resposta diante de um acidente com lesão?", "a": ["Somente emitir a CAT", "Prestar socorro e proteger a área, depois cumprir registros e prevenção", "Aguardar a próxima reunião da CIPA"], "c": 1, "why": "A prioridade é o atendimento e a proteção. Comunicação e medidas preventivas também são necessárias."}, {"q": "Qual alternativa diferencia corretamente as atribuições?", "a": ["NR-1: gerenciamento de riscos; CAT: comunicação; NR-5: CIPA", "CAT: inspeção preventiva; CIPA: emissão obrigatória da CAT", "NR-5: substitui todas as obrigações do empregador"], "c": 0, "why": "São mecanismos complementares, com finalidades diferentes."}, {"q": "No caso do piso molhado, qual plano é mais adequado?", "a": ["Emitir CAT e encerrar o assunto", "Apenas orientar a trabalhadora a prestar atenção", "Atender, comunicar quando cabível, apurar causas, sinalizar e revisar controles"], "c": 2, "why": "A resposta combina cuidado imediato, obrigação documental e prevenção de recorrência."}];let current=0;let answered={};const root=document.getElementById('slides');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function photo(i){return 'https://images.unsplash.com/'+photos[i]+'?auto=format&fit=crop&w=1250&q=85'}
function makeSlide(i){let [eyebrow,title,subtitle]=slidesData[i];let section=document.createElement('section');section.className='slide';section.id='s'+i;let head='<div class="heading"><div class="eyebrow">'+esc(eyebrow)+' · '+String(i+1).padStart(2,'0')+'/09</div><h1>'+esc(title)+'</h1><p>'+esc(subtitle)+'</p></div>';
if(i===0){section.innerHTML='<div class="hero"><div>'+head+'<div class="metadata"><div><b>Habilitação:</b> Técnico em Administração – Plano de Curso 891 (2024)</div><div><b>Componente Curricular:</b> II.3 – Processos Administrativos em Recursos Humanos</div><div><b>Professor(a):</b> Lucilene Aparecida Ramos</div><div><b>Tema / Base tecnológica:</b> Segurança do Trabalho — Legislação, CAT, NR-1 e NR-5</div><div><b>Número de aulas / duração:</b> Aula demonstrativa de 20 minutos</div></div><p><button class="btn primary" onclick="go(1)">Iniciar aula →</button></p></div><img class="photo" src="'+photo(i)+'" alt="Ambiente profissional de trabalho"></div>';return section}
let cards=content[i].map((x,j)=>'<button class="card" onclick="reveal('+i+','+j+')"><strong>'+esc(x[0])+'</strong><small>Toque para explorar o conceito e o exemplo →</small></button>').join('');let body='<div class="cards">'+cards+'</div><div class="reveal" id="reveal'+i+'" aria-live="polite">Selecione um cartão para revelar a explicação.</div>';
if(i===7){body+='<div class="question"><div class="big">Qual decisão você tomaria?</div><p id="qtext"></p><div class="options" id="options"></div><div class="reveal hidden" id="qfeedback" aria-live="polite"></div><p><button class="btn" onclick="nextQuestion()">Outra pergunta ↻</button></p></div>'}
section.innerHTML=head+'<div class="hero"><img class="photo" src="'+photo(i)+'" alt="Fotografia ilustrativa de situação de segurança no trabalho"><div><span class="pill">Explore e discuta</span><p style="font-size:20px;line-height:1.5"></p></div></div>'+body;return section}
slidesData.forEach((x,i)=>root.appendChild(makeSlide(i)));
function reveal(i,j){let x=content[i][j];document.getElementById('reveal'+i).innerHTML='<strong>'+esc(x[0])+'</strong><div>'+esc(x[1])+'</div>'}
function go(i){current=Math.max(0,Math.min(slidesData.length-1,i));document.querySelectorAll('.slide').forEach((s,j)=>s.classList.toggle('active',j===current));document.getElementById('counter').textContent=String(current+1).padStart(2,'0')+' / 09';document.getElementById('bar').style.width=((current+1)/9*100)+'%';document.getElementById('prev').disabled=current===0;document.getElementById('next').textContent=current===8?'Voltar à capa ↺':'Próxima →';document.getElementById('next').onclick=()=>go(current===8?0:current+1);if(current===7)drawQuestion();window.scrollTo(0,0)}
let qindex=0;function drawQuestion(){let q=quiz[qindex];document.getElementById('qtext').textContent=q.q;document.getElementById('options').innerHTML=q.a.map((a,j)=>'<button class="option" onclick="answer('+j+')">'+esc(a)+'</button>').join('');document.getElementById('qfeedback').classList.add('hidden')}
function answer(j){let q=quiz[qindex];let f=document.getElementById('qfeedback');f.textContent=(j===q.c?'✓ Correto! ':'Vamos revisar: ')+q.why;f.classList.remove('hidden')}
function nextQuestion(){qindex=(qindex+1)%quiz.length;drawQuestion()}
function toggleFull(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1)});go(0);
</script></body></html>
